name: build-opencv
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build wheel inside Alpine + Python 3.9 (with FFmpeg)
        run: |
          mkdir out
          docker run --rm -v $PWD/out:/out python:3.9-alpine3.20 sh -c '
            apk add --no-cache build-base cmake ninja linux-headers git pkgconf \
              jpeg-dev libpng-dev tiff-dev openblas-dev \
              ffmpeg-dev v4l-utils-dev &&
            pip install --upgrade pip wheel &&
            pip install --only-binary=:all: "numpy==1.26.4" "setuptools==59.2.0" scikit-build cmake ninja &&
            export CMAKE_ARGS="-DWITH_FFMPEG=ON -DWITH_V4L=ON" &&
            pip wheel --no-build-isolation --no-deps "opencv-python-headless==4.9.0.80" -w /out &&
            pip install --no-deps /out/*.whl &&
            python -c "import cv2; info=cv2.getBuildInformation(); print([l for l in info.splitlines() if \"FFMPEG\" in l or \"avcodec\" in l])"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: opencv-wheel
          path: out/*.whl
