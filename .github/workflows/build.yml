name: build-opencv
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build wheel inside Alpine + Python 3.9
        run: |
          mkdir out
          docker run --rm -v $PWD/out:/out python:3.9-alpine sh -c '
            apk add --no-cache build-base cmake ninja linux-headers git \
              jpeg-dev libpng-dev tiff-dev openblas-dev &&
            pip install --upgrade pip wheel &&
            pip install --only-binary=:all: "numpy==1.26.4" "setuptools==59.2.0" scikit-build cmake ninja &&
            pip wheel --no-build-isolation --no-deps "opencv-python-headless==4.9.0.80" -w /out
          '
      - uses: actions/upload-artifact@v4
        with:
          name: opencv-wheel
          path: out/*.whl
